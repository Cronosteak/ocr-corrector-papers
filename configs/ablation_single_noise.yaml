# Ablation: entrenamiento solo con un nivel de ruido (r=0.04)
# Evaluación sigue siendo sobre el test set completo (4 niveles)
model_name: "google/flan-t5-base"
max_input_length: 256
max_output_length: 256
prefix: "correct OCR: "

batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_epochs: 15
warmup_steps: 200
weight_decay: 0.01
max_grad_norm: 1.0
optim: adafactor
fp16: false
seed: 42
early_stopping_patience: 3

# Solo se conservan los pares con noise_rate == 0.04 en el conjunto de train.
# El conjunto de val/test permanece intacto.
noise_rate_filter: 0.04

train_split: 0.8
val_split: 0.1
test_split: 0.1

output_dir: "models/ablation_single_noise"
save_strategy: "epoch"
evaluation_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
dataloader_num_workers: 2
