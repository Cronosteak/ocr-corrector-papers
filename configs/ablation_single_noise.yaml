# Ablation: train on a single noise level (r=0.04)
# Evaluation still runs on the full test set (all 4 levels)
model_name: "google/flan-t5-base"
max_input_length: 256
max_output_length: 256
prefix: "correct OCR: "

batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_epochs: 15
warmup_steps: 200
weight_decay: 0.01
max_grad_norm: 1.0
optim: adafactor
fp16: false
seed: 42
early_stopping_patience: 3

# Only pairs with noise_rate == 0.04 are kept in the training set.
# The val/test sets are left untouched.
noise_rate_filter: 0.04

train_split: 0.8
val_split: 0.1
test_split: 0.1

output_dir: "models/ablation_single_noise"
save_strategy: "epoch"
evaluation_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
dataloader_num_workers: 2
