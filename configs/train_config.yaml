# Model training configuration

# Base model
model_name: "google/flan-t5-base"
# Alternatives: "google/flan-t5-small", "facebook/bart-base"

# Tokenization
max_input_length: 256
max_output_length: 256
prefix: "correct OCR: "

# Training
batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_epochs: 15
warmup_steps: 200
weight_decay: 0.01
max_grad_norm: 1.0
optim: adafactor
fp16: false
seed: 42
early_stopping_patience: 3

# Data splits
train_split: 0.8
val_split: 0.1
test_split: 0.1

# Model saving
output_dir: "models/ocr-corrector"
save_strategy: "epoch"
evaluation_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: "eval_loss"

# Hardware
fp16: false  # Set to true on a GPU with FP16 support
dataloader_num_workers: 2
