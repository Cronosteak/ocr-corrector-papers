# OpenAlex API query configuration
# Docs: https://docs.openalex.org/

# Search filters
filters:
  # Concepts: Electrical Engineering + related fields with good OA coverage
  # C39432304 = Electrical Engineering
  # C41008148 = Computer Science
  # C127413603 = Engineering
  # C185592680 = Chemistry
  concept_id: "C39432304"
  extra_concept_ids:
    - "C41008148"   # Computer Science
    - "C127413603"  # Engineering

  # Open-access papers only (we need the PDF)
  is_oa: true
  
  # Publication date range
  from_publication_date: "2018-01-01"
  to_publication_date: "2026-03-31"
  
  # Language — English only
  language: "en"

# Pagination
per_page: 50
max_results: 1500  # Raised to collect more papers

# Fields to retrieve for each work
select_fields:
  - id
  - doi
  - title
  - abstract_inverted_index
  - open_access
  - publication_date
  - language
  - primary_location
